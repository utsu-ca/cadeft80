[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadeft80"
version = "0.6.0"
description = "Python library for reading and writing 80-byte (TD) EFT files"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["eft", "payments canada", "80 byte", "banking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
cadeft80 = "cadeft80.__main__:main"

[project.urls]
Homepage = "https://github.com/protoconal/cadeft"
Issues = "https://github.com/protoconal/cadeft/issues"
Upstream = "https://github.com/moov-io/cadeft"

[tool.setuptools]
packages = ["cadeft80"]

[tool.setuptools.package-data]
cadeft80 = ["py.typed"]
